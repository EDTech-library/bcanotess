<!DOCTYPE html>
<html lang="en">
<head>
    <!-- এই লাইনটি যোগ করো -->
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Playground - ED Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden; 
        }

        /* Top Navigation Menu */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.05); 
            padding: 15px 25px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .logo-title { font-size: 18px; color: #38bdf8; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        .nav-links { display: flex; gap: 15px; }
        .nav-links button {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .nav-links button:hover, .nav-links button.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .back-btn { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .back-btn:hover { background: #0ea5e9; }

        /* Main Workspace - Split Screen */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
        }

        /* Left Section: Study Notes & PDFs */
        .study-section {
            width: 35%;
            background: rgba(15, 23, 42, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }
        .section-title { font-size: 16px; color: #38bdf8; margin-bottom: 15px; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 10px; }
        
        .topic-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .topic-box:hover { border-color: #38bdf8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .topic-box h3 { font-size: 15px; color: #f8fafc; margin-bottom: 5px; }
        .topic-box p { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
        
        .pdf-btn {
            background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 5px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; text-decoration: none; display: inline-block;
        }
        .pdf-btn:hover { background: #38bdf8; color: #0f172a; }

        /* Right Section: Live Editor & Result */
        .editor-section {
            width: 65%;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        /* Editor Containers */
        .workspace-container { display: flex; flex-direction: column; height: 100%; gap: 15px; }
        .hidden { display: none !important; }

        /* Code Input Area */
        .code-inputs { display: flex; gap: 15px; height: 40%; }
        .code-box {
            flex: 1; display: flex; flex-direction: column; background: #1e293b;
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;
        }
        .code-label {
            background: rgba(0, 0, 0, 0.3); padding: 8px 15px; font-size: 12px; font-weight: 600;
            color: #94a3b8; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center;
        }
        .code-label.html-label { color: #f97316; }
        .code-label.css-label { color: #38bdf8; }
        .code-label.js-label { color: #facc15; }
        .code-label.c-label { color: #4ade80; }
        
        textarea {
            flex: 1; background: transparent; color: #e2e8f0; padding: 15px; border: none; resize: none;
            outline: none; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.5;
        }

        /* Live Output Area */
        .output-container {
            flex: 1; background: #ffffff; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden; display: flex; flex-direction: column;
        }
        .output-label { background: #e2e8f0; color: #0f172a; padding: 5px 15px; font-size: 12px; font-weight: 600; }
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }

        /* C Terminal Output */
        .c-terminal { background: #0f172a; color: #4ade80; padding: 15px; font-family: 'Fira Code', monospace; font-size: 13px; overflow-y: auto; flex: 1; }
        .run-btn { background: #4ade80; color: #0f172a; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 11px; transition: 0.3s; }
        .run-btn:hover { background: #22c55e; }
        .run-btn:disabled { background: #64748b; cursor: not-allowed; }

        /* 🔒 PDF Secure Modal Overlay */
        .pdf-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); z-index: 2000; justify-content: center; align-items: center; flex-direction: column;
        }
        .pdf-modal.active { display: flex; }
        .pdf-container {
            position: relative; width: 90%; max-width: 900px; height: 85vh;
            background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pdf-container iframe { width: 100%; height: 100%; border: none; }
        
        .close-pdf-btn {
            background: #f87171; color: #fff; border: none; padding: 8px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; margin-bottom: 15px; font-size: 14px;
        }
        .close-pdf-btn:hover { background: #ef4444; }

        /* 🔒 PDF Popout Shield */
        .pdf-popout-shield {
            position: absolute; top: 0; right: 0; width: 70px; height: 60px; z-index: 10;
            background: transparent; cursor: not-allowed;
        }

        @media (max-width: 900px) {
            .workspace { flex-direction: column; overflow-y: auto; height: auto; }
            .study-section, .editor-section { width: 100%; height: auto; }
            .code-inputs { flex-direction: column; height: 400px; }
            .output-container { height: 400px; }
        }



        /* =========================================
   1. Compact & Scrollable Course Materials
   ========================================= */
#materialsContainer {
    max-height: 280px; /* এর বেশি বড় হবে না */
    overflow-y: auto;  /* বেশি মেটেরিয়াল থাকলে ভেতরেই স্ক্রোল হবে */
    padding-right: 10px;
    margin-bottom: 20px;
}

/* ফিউচারিস্টিক স্ক্রোলবার ডিজাইন (যাতে দেখতে সুন্দর লাগে) */
#materialsContainer::-webkit-scrollbar {
    width: 6px;
}
#materialsContainer::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
}
#materialsContainer::-webkit-scrollbar-thumb {
    background: #38bdf8;
    border-radius: 10px;
}
#materialsContainer::-webkit-scrollbar-thumb:hover {
    background: #0284c7;
}

/* =========================================
   Mobile Only: Bigger Code Editor & Output
   ========================================= */

/* এই কোডগুলো শুধুমাত্র ফোন বা ছোট স্ক্রিনের (max-width: 768px) জন্য কাজ করবে */
@media (max-width: 768px) {
    
    /* HTML, CSS, JS কোড লেখার বক্স */
    textarea {
        min-height: 300px !important; 
        font-size: 15px !important;
        line-height: 1.5 !important;
    }
    
    /* C প্রোগ্রামের কোড লেখার বক্স */
    #c-code {
        min-height: 350px !important;
    }

    /* HTML/CSS/JS আউটপুট দেখার বক্স */
    #output {
        min-height: 500px !important; 
        width: 100%;
        background: #ffffff; 
        border: 2px solid #38bdf8;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    /* টার্মিনাল (C Program) আউটপুট বক্স */
    #terminal {
        min-height: 400px !important;
    }
}

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <header>
        <div class="logo-title">👨‍💻 Coding Playground</div>
        <div class="nav-links">
            <button id="tab-web" class="active" onclick="switchTab('web')">HTML/CSS/JS</button>
            <button id="tab-c" onclick="switchTab('c')">C Program</button>
        </div>
        <button class="back-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
    </header>

    <!-- Main Workspace -->
    <div class="workspace">
        
        <!-- Left Side: Firebase Dynamic Study Materials -->
        <div class="study-section">
            <h2 class="section-title">📚 Course Materials</h2>
            <div id="materialsContainer">
                <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: 20px;">Loading notes from Firebase...</p>
            </div>
            <p style="font-size: 12px; color: #64748b; margin-top: 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                Read the notes above and practice the code on the right side! 👉
            </p>
        </div>

        <!-- Right Side: Code Editors -->
        <div class="editor-section">
            
            <!-- WEB DEV WORKSPACE -->
            <div id="web-workspace" class="workspace-container">
                <div class="code-inputs">
                    <div class="code-box">
                        <div class="code-label html-label"><span>index.html</span></div>
                        <textarea id="html-code" onkeyup="runWebCode()"></textarea>
                    </div>
                    <div class="code-box">
                        <div class="code-label css-label"><span>style.css</span></div>
                        <textarea id="css-code" onkeyup="runWebCode()"></textarea>
                    </div>
                    <div class="code-box">
                        <div class="code-label js-label"><span>script.js</span></div>
                        <textarea id="js-code" onkeyup="runWebCode()"></textarea>
                    </div>
                </div>
                <div class="output-container">
                    <div class="output-label">⚡ Live Output</div>
                    <iframe id="web-output-frame"></iframe>
                </div>
            </div>

            <!-- C PROGRAM WORKSPACE -->
            <div id="c-workspace" class="workspace-container hidden">
                <div class="code-box" style="flex: 1;">
                    <div class="code-label c-label">
                        <span>main.c</span>
                        <button class="run-btn" id="run-c-btn" onclick="runCCode()">▶ Run Code</button>
                    </div>
                    <textarea id="c-code" style="height: 100%;">#include <stdio.h>

int main() {
    int a = 10, b = 20;
    int sum = a + b;
    
    printf("Hello ED Tech Students!\n");
    printf("Sum of %d and %d is: %d\n", a, b, sum);
    
    return 0;
}</textarea>
                </div>
                <div class="output-container" style="flex: 1; border-color: #4ade80;">
                    <div class="output-label" style="background: #4ade80; color: #0f172a;">🖥️ Server Terminal Output</div>
                    <div class="c-terminal" id="c-terminal-output">
                        <span style="color: #64748b;">// Write C Code and click 'Run Code' to compile on server...</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 🔒 Secure PDF Viewer Modal -->
    <div class="pdf-modal" id="pdfModal">
        <button class="close-pdf-btn" onclick="closePDF()">✖ Close PDF</button>
        <div class="pdf-container">
            <!-- Pop-out blocker shield -->
            <div class="pdf-popout-shield" onclick="alert('Downloading or popping out PDF is strictly prohibited!');"></div>
            <iframe id="secure-pdf-frame" src=""></iframe>
        </div>
    </div>

    <!-- Firebase Connection for Dynamic Notes (WITH AUTH) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDy7xLO6WhCXFt8bPAU9AYFYtVoVw8t9k",
            authDomain: "ed-tech-c6b5a.firebaseapp.com",
            projectId: "ed-tech-c6b5a",
            storageBucket: "ed-tech-c6b5a.firebasestorage.app",
            messagingSenderId: "176482715149",
            appId: "1:176482715149:web:8fce7c5fe4fcbe4edff744"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app); // 🔒 Auth অ্যাড করা হলো

        async function fetchMaterials() {
            const container = document.getElementById('materialsContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "courseMaterials"));
                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 13px;">No notes added yet.</p>`;
                    return;
                }
                
                let htmlContent = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let safePdfUrl = data.pdfUrl;
                    
                    // 🔒 Auto format Drive link for security
                    if (safePdfUrl && safePdfUrl.includes('drive.google.com')) {
                        if (!safePdfUrl.includes('/preview')) {
                            safePdfUrl = safePdfUrl.replace(/\/view.*$/, '/preview');
                        }
                    }

                    let pdfBtn = safePdfUrl ? `<button onclick="openProtectedPDF('${safePdfUrl}')" class="pdf-btn">📄 Read Notes</button>` : '';
                    
                    htmlContent += `
                        <div class="topic-box">
                            <h3>${data.title}</h3>
                            <p>${data.description}</p>
                            ${pdfBtn}
                        </div>
                    `;
                });
                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("Error fetching materials:", error);
                container.innerHTML = `<p style="text-align: center; color: #f87171; font-size: 13px;">Failed to load notes.</p>`;
            }
        }

      // 🔒 Strict Auth Guard (লগইন ছাড়া ঢুকতে দেবে না)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ইউজার লগইন করা আছে, তাই ডেটা লোড হবে
                fetchMaterials();
            } else {
                // লগইন নেই! সোজা লগইন পেজে বের করে দেবে
                alert("Access Denied! Please login with Google to access this page.");
                window.location.href = "index.html"; // তোমার লগইন পেজের ফাইলের নাম যদি অন্য হয়, তাহলে এখানে সেটা লিখে দিও
            }
        });
    </script>


    <!-- Editor Scripts & PDF Modal Logic -->
    <script>
        // PDF Modal Logic
        function openProtectedPDF(url) {
            document.getElementById('secure-pdf-frame').src = url + "#toolbar=0";
            document.getElementById('pdfModal').classList.add('active');
        }

        function closePDF() {
            document.getElementById('secure-pdf-frame').src = "";
            document.getElementById('pdfModal').classList.remove('active');
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const webTab = document.getElementById('tab-web');
            const cTab = document.getElementById('tab-c');
            const webWorkspace = document.getElementById('web-workspace');
            const cWorkspace = document.getElementById('c-workspace');

            if(tab === 'web') {
                webTab.classList.add('active');
                cTab.classList.remove('active');
                webWorkspace.classList.remove('hidden');
                cWorkspace.classList.add('hidden');
            } else {
                cTab.classList.add('active');
                webTab.classList.remove('active');
                cWorkspace.classList.remove('hidden');
                webWorkspace.classList.add('hidden');
            }
        }

        // Web Dev Live Compiler
        function runWebCode() {
            let htmlCode = document.getElementById("html-code").value;
            let cssCode = "<style>" + document.getElementById("css-code").value + "</style>";
            let jsCode = "<script>" + document.getElementById("js-code").value + "<\/script>";
            
            let outputFrame = document.getElementById("web-output-frame");
            let outputDoc = outputFrame.contentDocument || outputFrame.contentWindow.document;

            outputDoc.open();
            outputDoc.writeln(htmlCode + cssCode + jsCode);
            outputDoc.close();
        }
// 🟢 REAL C Compiler (Using Wandbox API - Highly Reliable)
        async function runCCode() {
            const terminal = document.getElementById("c-terminal-output");
            const runBtn = document.getElementById("run-c-btn");
            const code = document.getElementById("c-code").value;
            
            terminal.innerHTML = `<span style="color: #facc15;">Connecting to Server... Compiling code... ⏳</span><br>`;
            runBtn.disabled = true;
            runBtn.innerText = "Running...";

            try {
                // Calling Wandbox Free Compiler API
                const response = await fetch('https://wandbox.org/api/compile.json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        compiler: 'gcc-head', // Latest GCC Compiler
                        code: code,
                        save: false
                    })
                });

                const data = await response.json();
                
                if (data.status === "0") {
                    // Success (No Compilation Error)
                    const outputFormatted = data.program_message ? data.program_message.replace(/\n/g, "<br>") : "";
                    terminal.innerHTML = `<span style="color: #4ade80;">Compilation Successful!</span><br><br>${outputFormatted}<br><br><span style="color: #64748b;">[Process finished with exit code 0]</span>`;
                } else {
                    // Compilation Error present in code
                    const errorFormatted = (data.compiler_error || data.program_error || "Unknown Error").replace(/\n/g, "<br>");
                    terminal.innerHTML = `<span style="color: #f87171;">Compilation Error:</span><br><br>${errorFormatted}`;
                }
            } catch (error) {
                // If API fails or Network issue
                terminal.innerHTML = `<span style="color: #f87171;">Server Network Error! Please check your internet connection or try again later.</span>`;
                console.error("Compiler API Error:", error);
            } finally {
                runBtn.disabled = false;
                runBtn.innerText = "▶ Run Code";
            }
        }

        // Default Web Code Load
        document.getElementById("html-code").value = "<h1>Web Dev Playground</h1>\n<p>Start writing code!</p>";
        document.getElementById("css-code").value = "body { font-family: Arial; text-align: center; }\nh1 { color: #38bdf8; }";
        runWebCode(); 
    </script>
</body>
</html>
