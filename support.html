<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Tech - Support & Help</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 80px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 20px;
            color: #38bdf8;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .support-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .support-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .whatsapp-support-btn {
            display: inline-block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            transition: 0.3s;
        }
        .whatsapp-support-btn:hover {
            opacity: 0.9;
        }

        /* Mobile Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #1e1b4b;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .nav-item span {
            margin-top: 2px;
            font-size: 10px;
        }
        .nav-item.active, .nav-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>💬 Help & Support</h1>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
        </header>

        <div class="support-card">
            <h3>Need Instant Assistance?</h3>
            <p>If you are facing any issues with your course access, assignments, or payments, feel free to reach out to us directly via WhatsApp.</p>
            
            <a href="https://wa.me/919836370351?text=Hello%20ED%20Tech,%20I%20need%20help%20with..." target="_blank" class="whatsapp-support-btn">
                💬 Chat on WhatsApp
            </a>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'">🏠<span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='courses.html'">📚<span>Courses</span></div>
        <div class="nav-item" onclick="window.location.href='tasks1.html'">📝<span>Updates</span></div>
        <div class="nav-item" onclick="window.location.href='profile.html'">👤<span>Profile</span></div>
    </div>


    <script>
    // ১. মাউসের রাইট ক্লিক ডিজাবেল করা
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        alert('Right click is disabled to protect content privacy!');
    });

    // ২. কিবোর্ড শর্টকাট (Ctrl+C, Ctrl+U, Print Screen ইত্যাদি) ব্লক করা
    document.addEventListener('keydown', function(e) {
        // Ctrl+C (Copy), Ctrl+U (View Source), Ctrl+S (Save), F12 (Inspect) ব্লক করা
        if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'p')) {
            e.preventDefault();
            alert('Copying content is strictly prohibited!');
        }
        // Print Screen বা স্ক্রিনশট কি ব্লক করা
        if (e.key === 'PrintScreen') {
            e.preventDefault();
            navigator.clipboard.writeText(''); // ক্লিপবোর্ড ক্লিয়ার করে দেওয়া
            alert('Screenshots are not allowed on this platform!');
        }
    });

    // ৩. টেক্সট সিলেক্ট করা বা ড্র্যাগ করা বন্ধ করা
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
    });
</script>

</body>
</html>
