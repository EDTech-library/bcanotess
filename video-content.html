<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Tech - Premium Video Courses</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #0f172a, #1e1b4b); 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            overflow-x: hidden; 
            /* 🔒 টেক্সট সিলেক্ট করা পুরোপুরি বন্ধ করার কোড */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .menu-toggle { display: none; position: fixed; top: 15px; left: 15px; background: #38bdf8; color: #0f172a; border: none; padding: 8px 12px; border-radius: 6px; font-size: 18px; cursor: pointer; z-index: 101; }

        /* সাইডবার */
        .sidebar { width: 280px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid rgba(255, 255, 255, 0.1); height: 100vh; position: fixed; left: 0; top: 0; padding: 20px; overflow-y: auto; z-index: 100; transition: 0.3s; }
        .sidebar h2 { font-size: 20px; color: #38bdf8; margin-bottom: 25px; text-align: center; }

        .subject-group { margin-bottom: 10px; }
        .subject-title { padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 14px; color: #e2e8f0; background: rgba(255, 255, 255, 0.03); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
        .subject-title:hover { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        
        .chapter-list { list-style: none; padding-left: 15px; margin-top: 5px; display: none; }
        .chapter-list.open { display: block; }
        
        .chapter-list li { 
            padding: 10px; 
            margin: 6px 0; 
            border-radius: 8px; 
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; 
            flex-direction: column;
            gap: 8px; 
        }
        .chapter-list li:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(56, 189, 248, 0.2); }
        .chapter-title-text { font-size: 13px; color: #e2e8f0; font-weight: 500; }
        
        .btn-group { display: flex; gap: 6px; width: 100%; }
        
        .media-btn { 
            flex: 1; 
            background: rgba(56, 189, 248, 0.1); 
            border: 1px solid rgba(56, 189, 248, 0.3); 
            color: #38bdf8; 
            padding: 6px 4px; 
            border-radius: 6px; 
            font-size: 11px; 
            font-weight: 600;
            cursor: pointer; 
            transition: 0.3s; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 4px; 
        }
        .media-btn:hover { background: #38bdf8; color: #0f172a; }
        
        .pdf-btn { 
            background: rgba(74, 222, 128, 0.1); 
            border-color: rgba(74, 222, 128, 0.3); 
            color: #4ade80; 
        }
        .pdf-btn:hover { background: #4ade80; color: #0f172a; }

        /* পার্সোনাল নোটস বক্স */
        .notes-section { margin-top: 25px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; }
        .notes-section h4 { font-size: 12px; color: #38bdf8; margin-bottom: 8px; text-transform: uppercase; }
        .notes-textarea { width: 100%; height: 80px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #fff; padding: 8px; font-size: 12px; resize: none; outline: none; }
        .save-note-btn { margin-top: 6px; background: #38bdf8; color: #0f172a; border: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 11px; cursor: pointer; transition: 0.3s; }
        .save-note-btn:hover { background: #0ea5e9; }

        /* মেইন কন্টেন্ট */
        .main-content { margin-left: 280px; flex: 1; padding: 30px; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); padding: 12px 25px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; flex-shrink: 0; }
        .back-btn { background: rgba(255, 255, 255, 0.1); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        
        .content-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; flex: 1; display: flex; flex-direction: column; margin-bottom: 10px; align-items: center; justify-content: center;}
        
        /* 🚀 আপডেট করা ডাইনামিক কন্টেইনার */
        .video-container { 
            position: relative; 
            width: 100%; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            display: none; 
            margin: 0 auto;
            transition: all 0.3s ease; 
        }
        
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* 🎬 ভিডিওর জন্য সাইজ (16:9) */
        .mode-video { max-width: 900px; aspect-ratio: 16 / 9; height: auto; }

        /* 📑 পিডিএফের জন্য লম্বা সাইজ (A4 স্টাইল) */
        .mode-pdf { max-width: 1000px; height: 85vh; aspect-ratio: auto; }

        /* 🔒 পারফেক্ট শিল্ড ডিজাইন */
        .top-bar-shield { position: absolute; top: 0; left: 0; width: calc(100% - 90px); height: 65px; z-index: 10; background: transparent; }
        .logo-shield { position: absolute; bottom: 0; right: 45px; width: 85px; height: 50px; z-index: 10; background: transparent; }
        .pdf-popout-shield { position: absolute; top: 0; right: 0; width: 70px; height: 60px; z-index: 10; background: transparent; }

        /* সিকিউরিটি ওয়াটারমার্ক */
        .watermark-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .watermark-text { position: absolute; color: rgba(250, 204, 21, 0.22); font-size: 24px; font-weight: 700; transform: rotate(-30deg); white-space: nowrap; user-select: none; }

        /* 📱 মোবাইলের জন্য মিডিয়া কোয়ারি (Responsive) */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { left: -280px; }
            .sidebar.active { left: 0; }
            .main-content { margin-left: 0; padding: 15px; padding-top: 60px; height: auto; min-height: 100vh; }
            
            /* মোবাইল সাইজ আপডেট */
            .mode-pdf { height: 75vh; }
            .mode-video { aspect-ratio: 16 / 9; height: auto; }
        }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="watermark-overlay" id="watermarkContainer"></div>

    <div class="sidebar" id="sidebar">
        <h2>🎥 Video Courses</h2>
        
        <div id="dynamicMenuContainer">
            <p style="color: #94a3b8; font-size: 12px; text-align: center; margin-top: 20px;">Loading content...</p>
        </div>

        <div class="notes-section">
            <h4>📌 My Video Notes</h4>
            <textarea class="notes-textarea" id="userVideoNote" placeholder="Write video timestamps or notes here..."></textarea>
            <button class="save-note-btn" id="saveNoteBtn">Save Notes</button>
        </div>
    </div>

    <div class="main-content">
        <header>
            <h1 id="contentTitle" style="font-size: 18px; color: #38bdf8;">Select a topic from the menu</h1>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">🏠 Dashboard</button>
        </header>

        <div class="content-card" id="displayArea">
            <p id="placeholderText" style="color: #94a3b8; text-align: center;">Please select a Video or PDF from the left menu to start learning.</p>
            
            <div class="video-container" id="videoContainer">
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDy7xLO6WhCXFt8bPAU9AYFYtVoVw8t9k",
            authDomain: "ed-tech-c6b5a.firebaseapp.com",
            projectId: "ed-tech-c6b5a",
            storageBucket: "ed-tech-c6b5a.firebasestorage.app",
            messagingSenderId: "176482715149",
            appId: "1:176482715149:web:8fce7c5fe4fcbe4edff744"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                createDynamicWatermark(user.email || user.displayName || "Protected Student");
                
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                if (userDoc.exists() && userDoc.data().videoNote) {
                    document.getElementById('userVideoNote').value = userDoc.data().videoNote;
                }

                fetchDynamicVideos();
            } else {
                window.location.href = "index.html";
            }
        });

        async function fetchDynamicVideos() {
            const menuContainer = document.getElementById('dynamicMenuContainer');
            menuContainer.innerHTML = "";

            try {
                const querySnapshot = await getDocs(collection(db, "videoCourses"));
                if (querySnapshot.empty) {
                    menuContainer.innerHTML = `<p style="color: #94a3b8; font-size: 12px; text-align: center; margin-top: 20px;">No content available yet.</p>`;
                    return;
                }

                let htmlContent = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.subjectName && data.videos) {
                        const uniqueId = docSnap.id;
                        htmlContent += `
                            <div class="subject-group">
                                <div class="subject-title" onclick="toggleChapters('${uniqueId}')">
                                    📁 ${data.subjectName} <span>▼</span>
                                </div>
                                <ul class="chapter-list" id="${uniqueId}">
                        `;
                        
                        data.videos.forEach((vid) => {
                            let buttonsHTML = "";
                            
                            if (vid.videoUrl) {
                                buttonsHTML += `<button class="media-btn" onclick="loadMedia('${vid.title} (Video)', '${vid.videoUrl}')">🎬 Play Video</button>`;
                            }
                            if (vid.pdfUrl) {
                                buttonsHTML += `<button class="media-btn pdf-btn" onclick="loadMedia('${vid.title} (Notes)', '${vid.pdfUrl}')">📑 Read PDF</button>`;
                            }

                            if(buttonsHTML !== "") {
                                htmlContent += `
                                <li>
                                    <span class="chapter-title-text">📌 ${vid.title}</span>
                                    <div class="btn-group">
                                        ${buttonsHTML}
                                    </div>
                                </li>`;
                            }
                        });

                        htmlContent += `</ul></div>`;
                    }
                });

                menuContainer.innerHTML = htmlContent;
            } catch (error) {
                console.error("Error fetching content:", error);
                menuContainer.innerHTML = `<p style="color: #f87171; font-size: 12px; text-align: center;">Failed to load content.</p>`;
            }
        }

        document.getElementById('saveNoteBtn').addEventListener('click', async () => {
            if (!currentUser) return;
            const noteText = document.getElementById('userVideoNote').value;
            try {
                await setDoc(doc(db, "users", currentUser.uid), { videoNote: noteText }, { merge: true });
                alert("Notes saved successfully!");
            } catch (error) {
                alert("Failed to save note.");
            }
        });

        function createDynamicWatermark(userText) {
            const container = document.getElementById('watermarkContainer');
            for (let i = 0; i < 6; i++) {
                const div = document.createElement('div');
                div.className = 'watermark-text';
                div.innerText = `${userText} • ED Tech Protected`;
                div.style.top = `${i * 18}%`;
                div.style.left = `${(i % 2) * 20}%`;
                container.appendChild(div);
            }
        }
    </script>

    <script>
        function toggleChapters(id) {
            const list = document.getElementById(id);
            if(list) list.classList.toggle('open');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // 🚀 আপডেট করা loadMedia ফাংশন (ডাইনামিক সাইজ চেঞ্জ সহ)
        function loadMedia(title, mediaUrl) {
            document.getElementById('contentTitle').innerText = title;
            document.getElementById('placeholderText').style.display = 'none';
            
            let finalUrl = mediaUrl;
            let shieldHTML = '';
            
            const videoContainer = document.getElementById('videoContainer');
            
            // নতুন কিছু লোড হওয়ার আগে আগের সাইজগুলো মুছে দেওয়া হলো
            videoContainer.classList.remove('mode-video', 'mode-pdf');

            // 🎥 ইউটিউব ভিডিও চেক
            if (finalUrl.includes('youtube.com') || finalUrl.includes('youtu.be')) {
                if (finalUrl.includes('watch?v=')) {
                    finalUrl = finalUrl.replace('watch?v=', 'embed/');
                    finalUrl = finalUrl.split('&')[0];
                } else if (finalUrl.includes('youtu.be/')) {
                    finalUrl = finalUrl.replace('youtu.be/', 'youtube.com/embed/');
                    finalUrl = finalUrl.split('?')[0];
                }
                
                shieldHTML = `
                    <div class="top-bar-shield" onclick="alert('Copying or sharing is strictly prohibited!');"></div>
                    <div class="logo-shield" onclick="alert('Action blocked to protect video content!');"></div>
                `;
                finalUrl += "?modestbranding=1&rel=0"; 
                
                // ভিডিওর জন্য 16:9 সাইজ
                videoContainer.classList.add('mode-video'); 
            } 
            // 📄 গুগল ড্রাইভ পিডিএফ চেক
            else if (finalUrl.includes('drive.google.com')) {
                if (!finalUrl.includes('/preview')) {
                    finalUrl = finalUrl.replace(/\/view.*$/, '/preview');
                }
                
                shieldHTML = `
                    <div class="pdf-popout-shield" onclick="alert('Downloading or popping out PDF is strictly prohibited!');"></div>
                `;
                
                // পিডিএফের জন্য লম্বা (A4) সাইজ
                videoContainer.classList.add('mode-pdf'); 
            }

            videoContainer.style.display = 'block';
            
            videoContainer.innerHTML = `
                ${shieldHTML}
                <iframe src="${finalUrl}#toolbar=0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            `;

            // মোবাইলে ক্লিক করার পর সাইডবার নিজে থেকে বন্ধ হয়ে যাবে
            if(window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('active');
            }
        }

        // 🔒 ফুল সিকিউরিটি স্ক্রিপ্ট (Right Click, F12, Copy, Cut)
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'c' || e.key === 's' || e.key === 'p' || e.key === 'x'))) {
                e.preventDefault();
                alert('This action is strictly prohibited on protected courses!');
            }
        });

        document.addEventListener('copy', function(e) {
            e.preventDefault();
            alert('Copying is strictly prohibited!');
        });

        document.addEventListener('cut', function(e) {
            e.preventDefault();
            alert('Cutting is strictly prohibited!');
        });
    </script>
</body>
</html>
