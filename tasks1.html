<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Tech - MAKAUT Updates & Notices</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 90px;
            /* 🔒 টেক্সট সিলেক্ট করা বন্ধ */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 18px;
            color: #38bdf8;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Notice Feed Container */
        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .notice-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        .notice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .notice-title {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 600;
        }
        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .badge.result {
            background: rgba(74, 222, 128, 0.1);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }
        .badge.alert {
            background: rgba(248, 113, 113, 0.1);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }
        .notice-desc {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
            line-height: 1.5;
            white-space: pre-wrap; /* লাইন ব্রেক সাপোর্ট করার জন্য */
        }
        .notice-img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }
        .attachment-btn {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 15px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            transition: 0.3s;
        }
        .attachment-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .notice-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            margin-top: 10px;
        }
        .notice-date {
            font-size: 11px;
            color: #64748b;
        }

        /* WhatsApp Style Reactions */
        .reactions-bar {
            display: flex;
            gap: 10px;
        }
        .reaction-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 13px;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .reaction-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }
        .reaction-btn.active {
            background: rgba(56, 189, 248, 0.3);
            border-color: #38bdf8;
        }

        /* Mobile Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #1e1b4b;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }
        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 20px; }
        }
        .nav-item {
            text-align: center;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.3s;
        }
        .nav-item span {
            margin-top: 2px;
            font-size: 10px;
        }
        .nav-item.active, .nav-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📢 MAKAUT Updates & Notices</h1>
            <button class="back-btn" onclick="window.location.href='dashboard.html'">Dashboard</button>
        </header>

        <!-- Live Updates & Notices Feed -->
        <div class="feed-container" id="feedContainer">
            <p style="text-align: center; color: #94a3b8; margin-top: 30px;">Loading updates...</p>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='dashboard.html'">🏠<span>Home</span></div>
        <div class="nav-item" onclick="window.location.href='courses.html'">📚<span>Courses</span></div>
        <div class="nav-item active" onclick="window.location.href='tasks1.html'">📝<span>Updates</span></div>
        <div class="nav-item" onclick="window.location.href='profile.html'">👤<span>Profile</span></div>
    </div>

    <!-- Firebase Connection Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDDy7xLO6WhCXFt8bPAU9AYFYtVoVw8t9k",
            authDomain: "ed-tech-c6b5a.firebaseapp.com",
            projectId: "ed-tech-c6b5a",
            storageBucket: "ed-tech-c6b5a.firebasestorage.app",
            messagingSenderId: "176482715149",
            appId: "1:176482715149:web:8fce7c5fe4fcbe4edff744"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                fetchUpdates();
            } else {
                window.location.href = "index.html"; // লগইন না থাকলে ইনডেক্সে পাঠাবে
            }
        });

        async function fetchUpdates() {
            const feedContainer = document.getElementById('feedContainer');
            feedContainer.innerHTML = "";

            try {
                // ফায়ারবেস থেকে "notices" কালেকশনের ডেটা আনা হবে
                const querySnapshot = await getDocs(collection(db, "notices"));
                
                if (querySnapshot.empty) {
                    feedContainer.innerHTML = `<p style="text-align: center; color: #94a3b8; margin-top: 30px;">No new updates right now.</p>`;
                    return;
                }

                let htmlContent = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // ইমেজ চেক
                    let imageHTML = data.imageUrl ? `<img src="${data.imageUrl}" alt="Notice Image" class="notice-img">` : '';
                    
                    // পিডিএফ বা ফাইল লিংক চেক
                    let fileHTML = data.fileUrl ? `<br><a href="${data.fileUrl}" target="_blank" class="attachment-btn">📄 View Document / PDF</a>` : '';

                    // ব্যাজ স্টাইল (Result, Alert, Notice)
                    let badgeClass = "badge";
                    if (data.badgeType === "result") badgeClass += " result";
                    else if (data.badgeType === "alert") badgeClass += " alert";

                    htmlContent += `
                        <div class="notice-card">
                            <div class="notice-header">
                                <span class="notice-title">${data.title}</span>
                                <span class="${badgeClass}">${data.badgeText || 'Notice'}</span>
                            </div>
                            <p class="notice-desc">${data.description}</p>
                            ${imageHTML}
                            ${fileHTML}
                            <div class="notice-footer">
                                <span class="notice-date">📅 ${data.date || 'Just now'}</span>
                                <div class="reactions-bar">
                                    <button class="reaction-btn" onclick="toggleReaction(this)">👍 <span class="count">${Math.floor(Math.random() * 10) + 1}</span></button>
                                    <button class="reaction-btn" onclick="toggleReaction(this)">❤️ <span class="count">${Math.floor(Math.random() * 5)}</span></button>
                                     <button class="reaction-btn" onclick="toggleReaction(this)">😢 <span class="count">0</span></button>
                                    <button class="reaction-btn" onclick="toggleReaction(this)">😡 <span class="count">0</span></button>
                                </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                feedContainer.innerHTML = htmlContent;
            } catch (error) {
                console.error("Error fetching notices:", error);
                feedContainer.innerHTML = `<p style="text-align: center; color: #f87171;">Failed to load updates.</p>`;
            }
        }
    </script>

    <!-- Normal Script for UI and Security -->
    <script>
        // WhatsApp style reaction click logic
        function toggleReaction(button) {
            const countSpan = button.querySelector('.count');
            let count = parseInt(countSpan.innerText);
            
            if (button.classList.contains('active')) {
                button.classList.remove('active');
                count -= 1;
            } else {
                button.classList.add('active');
                count += 1;
            }
            countSpan.innerText = count;
        }

        // 🔒 ফুল সিকিউরিটি স্ক্রিপ্ট (Right Click, F12, Copy, Cut)
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'c' || e.key === 's' || e.key === 'p' || e.key === 'x'))) {
                e.preventDefault();
                alert('This action is strictly prohibited!');
            }
        });

        document.addEventListener('copy', function(e) {
            e.preventDefault();
            alert('Copying is strictly prohibited!');
        });

        document.addEventListener('cut', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
