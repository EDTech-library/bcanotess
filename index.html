<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="icon.png">
    <!-- Social Media & WhatsApp Preview Tags -->
    <meta property="og:title" content="ED Tech - Login">
    <meta property="og:description" content="Welcome to ED Tech, powered by EduCraft. Login to access your notes.">
    <meta property="og:image" content="https://edtech-library.github.io/bcanotess/logo1.png">
    <meta property="og:url" content="https://edtech-library.github.io/bcanotess/index.html">
    <meta property="og:type" content="website">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ED Tech - Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <!-- Glassmorphism Card -->
        <div class="glass-card">
            <div class="brand-header">
                <!-- 🚀 লোগো ডবল সাইজ করা হলো এবং ED Tech লেখা সরানো হলো 🚀 -->
              <img src="logo.png" alt="ED Tech Logo" draggable="false" style="width: 200px; height: auto; margin-bottom: 10px; user-select: none; pointer-events: none;">
                
                <p class="tagline">Powered by EduCraft</p>
            </div>

            <div class="login-content">
                <p class="welcome-text">Welcome back! Please login to access your courses.</p>
                
                <!-- Google Login Button -->
                <button id="googleLoginBtn" class="btn google-btn">
                    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google Logo" class="google-icon">
                    Continue with Google
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- 🚀 Email & Password Login Section 🚀 -->
                <div class="email-login-section">
                    <input type="email" id="loginEmail" class="input-field" placeholder="Enter Email ID">
                    <input type="password" id="loginPassword" class="input-field" placeholder="Enter Password">
                    <button id="emailLoginBtn" class="btn otp-btn">Login</button>
                </div>

            </div>
        </div>
    </div>

  <script type="module" src="script.js"></script>
</body>
</html>
